workflows:
  ios-unsigned-ipa:
    name: iOS Unsigned IPA (for Sideloadly)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get

      - name: Install CocoaPods dependencies
        script: |
          find . -name "Podfile" -maxdepth 2 -execdir pod install \;

      - name: Build unsigned iOS app
        script: |
          flutter build ios --release --no-codesign

      - name: Package into unsigned .ipa
        script: |
          set -e
          cd build/ios/iphoneos
          rm -rf Payload
          mkdir Payload
          cp -r Runner.app Payload/
          # -X strips extended attributes/resource forks that can confuse
          # re-signing tools; -r recurses; -y preserves symlinks as-is
          # instead of dereferencing them (app bundles rely on this).
          zip -qXry unsigned_app.ipa Payload
          rm -rf Payload

    artifacts:
      - build/ios/iphoneos/unsigned_app.ipa

    publishing:
      email:
        recipients:
          - thesiscpe837@gmail.com
        notify:
          success: true
          failure: true

  android-apk:
    name: Android APK (sideload)
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get

      - name: Build APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk

    publishing:
      email:
        recipients:
          - thesiscpe837@gmail.com
        notify:
          success: true
          failure: true