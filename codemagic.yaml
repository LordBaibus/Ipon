workflows:
  ios-unsigned-ipa:
    name: iOS Unsigned IPA (for Sideloadly)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get

      - name: Generate ios/Podfile if missing
        script: |
          # This project has never been built for iOS before, so
          # ios/Podfile doesn't exist in the repo yet. `flutter build ios`
          # would normally generate it and run `pod install` itself, but
          # the version it generates defaults to platform :ios, '12.0',
          # which is too old for google_mlkit_text_recognition (needs
          # 15.5+). So generate it here first, patch it, then let the
          # real build step use the patched version.
          if [ ! -f ios/Podfile ]; then
            flutter build ios --release --no-codesign --config-only || true
          fi

      - name: Set iOS deployment target to 15.5
        script: |
          set -e
          test -f ios/Podfile
          if grep -q "^platform :ios" ios/Podfile; then
            sed -i '' "s/^platform :ios.*/platform :ios, '15.5'/" ios/Podfile
          else
            printf "%s\n%s\n" "platform :ios, '15.5'" "$(cat ios/Podfile)" > ios/Podfile
          fi
          head -5 ios/Podfile

      - name: Set Xcode project deployment target to 15.5
        script: |
          set -e
          # The Podfile's platform line only sets CocoaPods' resolution
          # floor. The Runner target's own IPHONEOS_DEPLOYMENT_TARGET
          # (Debug/Release/Profile configs) can independently still be
          # lower and cause the same "requires higher deployment target"
          # error again at the actual build step. Bump all of them too.
          sed -i '' "s/IPHONEOS_DEPLOYMENT_TARGET = .*;/IPHONEOS_DEPLOYMENT_TARGET = 15.5;/g" \
            ios/Runner.xcodeproj/project.pbxproj
          grep IPHONEOS_DEPLOYMENT_TARGET ios/Runner.xcodeproj/project.pbxproj

      - name: Install CocoaPods dependencies
        script: |
          cd ios && pod install --repo-update

      - name: Build unsigned iOS app
        script: |
          flutter build ios --release --no-codesign

      - name: Package into unsigned .ipa
        script: |
          set -e
          cd build/ios/iphoneos
          rm -rf Payload
          mkdir Payload
          cp -r Runner.app Payload/
          # -X strips extended attributes/resource forks that can confuse
          # re-signing tools; -r recurses; -y preserves symlinks as-is
          # instead of dereferencing them (app bundles rely on this).
          zip -qXry unsigned_app.ipa Payload
          rm -rf Payload

    artifacts:
      - build/ios/iphoneos/unsigned_app.ipa

    publishing:
      email:
        recipients:
          - thesiscpe837@gmail.com
        notify:
          success: true
          failure: true

  android-apk:
    name: Android APK (sideload)
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get

      - name: Build APK
        script: |
          flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk

    publishing:
      email:
        recipients:
          - thesiscpe837@gmail.com
        notify:
          success: true
          failure: true